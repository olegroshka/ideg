[project]
name = "ideg"
version = "0.0.1"
description = "IDEG Track E3 toy models (BH-004 / HYP-009)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "qutip", "networkx", "matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
